server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 1. GZIP COMPRESSION
    # Compresses HTML, JS, and CSS files on-the-fly before sending them over the wire.
    # Reduces download size by ~70% so the site loads 3x faster on slow WiFi or 4G.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 2. INTERNAL PROXY FALLBACK (Trailing Slash Trick)
    # If the frontend is run alone without the gateway container, it can forward /api/ to backend:8000.
    # Notice: 'proxy_pass http://backend:8000/;' (with trailing slash) automatically strips '/api/'!
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. IMMUTABLE ASSET CACHING (Performance Boost)
    # Vite adds a unique content hash to every JS/CSS file (e.g., chunk-7x9a.js).
    # Tells browsers: "Cache this file for 1 year. It will never change!"
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 4. SINGLE PAGE APPLICATION (SPA) ROUTING FIX
    # In React Router, if you refresh http://localhost:3000/blog/5, no physical file 'blog/5' exists.
    # 'try_files $uri $uri/ /index.html' sends the user to index.html so React can handle the URL!
    location / {
        try_files $uri $uri/ /index.html;
    }
}